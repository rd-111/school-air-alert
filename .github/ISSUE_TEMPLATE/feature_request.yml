name: Feature request
description: Suggest a focused improvement or feature.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected user-visible result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
  - type: checkboxes
    id: safety
    attributes:
      label: Product and safety considerations
      options:
        - label: I have not presented forecast data as a measured observation or medical guarantee.
        - label: I have not included secrets or private school/student information.
